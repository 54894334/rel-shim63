name: shim63
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build shim dylib
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos --show-sdk-version
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -fobjc-exceptions \
            -Os \
            -install_name @rpath/rely_transport.framework/rely_transport \
            -o rely_transport \
            hook/rely_shim.m \
            -framework Foundation \
            -framework CoreGraphics \
            -framework UIKit \
            -framework AVFoundation \
            -framework Security
          codesign -s - --force rely_transport
          ls -l rely_transport
          xcrun -sdk iphoneos otool -D rely_transport | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: rely_transport
          path: rely_transport
